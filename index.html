<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — Veille Cyber / IA / Tech</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14;
    --panel:#111826;
    --panel-2:#161F30;
    --line:#212B3D;
    --text:#E8ECF1;
    --text-dim:#7C8798;
    --critique:#FF4D5E;
    --eleve:#FFB020;
    --moyen:#2DD4BF;
    --faible:#5B6779;
    --cyan:#3DDBFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(ellipse at top, #0D1420 0%, #0A0E14 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  ::selection{background:var(--cyan); color:#0A0E14;}

  header{
    position:relative;
    padding:28px 20px 22px;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .radar{
    position:absolute; top:-60px; right:-40px;
    width:200px; height:200px; border-radius:50%;
    border:1px solid var(--line);
    opacity:.6;
  }
  .radar::before, .radar::after{
    content:''; position:absolute; border-radius:50%; border:1px solid var(--line);
  }
  .radar::before{ inset:35px; }
  .radar::after{ inset:70px; }
  .sweep{
    position:absolute; top:-60px; right:-40px; width:200px; height:200px;
    border-radius:50%; overflow:hidden;
    animation:spin 4s linear infinite;
  }
  .sweep::before{
    content:''; position:absolute; top:0; left:0; width:50%; height:50%;
    transform-origin:100% 100%;
    background:conic-gradient(from 0deg, rgba(61,219,255,.35), transparent 40deg);
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.15em; color:var(--cyan);
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .dot{width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:34px; letter-spacing:-.02em;
  }
  .sub{ color:var(--text-dim); font-size:14px; margin-top:6px; max-width:520px; }

  .statusbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-top:20px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim);
  }
  .statusbar span.live{ color:var(--moyen); }
  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    padding:9px 16px; border-radius:8px; cursor:pointer; transition:.15s;
  }
  button:hover{ border-color:var(--cyan); color:var(--cyan); }
  button:disabled{ opacity:.5; cursor:wait; }
  button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  nav.tabs{
    display:flex; gap:4px; padding:16px 20px 0; border-bottom:1px solid var(--line);
  }
  nav.tabs button.tab{
    background:transparent; border:none; border-bottom:2px solid transparent;
    border-radius:0; padding:10px 6px; margin-right:18px; color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif; font-size:14px;
  }
  nav.tabs button.tab.active{ color:var(--text); border-bottom-color:var(--cyan); }
  nav.tabs button.tab:hover{ color:var(--text); border-color:transparent; }

  main{ max-width:760px; margin:0 auto; padding:24px 20px; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip{
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:6px 10px;
    border-radius:20px; border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
  }
  .chip.active{ border-color:var(--cyan); color:var(--cyan); }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; margin-bottom:12px; position:relative;
    border-left:3px solid var(--faible);
  }
  .card.critique{ border-left-color:var(--critique); }
  .card.eleve{ border-left-color:var(--eleve); }
  .card.moyen{ border-left-color:var(--moyen); }
  .card.faible{ border-left-color:var(--faible); }

  .card-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:8px;}
  .badges{ display:flex; gap:6px; flex-wrap:wrap; }
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em;
    padding:3px 8px; border-radius:5px; text-transform:uppercase;
  }
  .badge.imp-critique{ background:rgba(255,77,94,.15); color:var(--critique); }
  .badge.imp-eleve{ background:rgba(255,176,32,.15); color:var(--eleve); }
  .badge.imp-moyen{ background:rgba(45,212,191,.15); color:var(--moyen); }
  .badge.imp-faible{ background:rgba(91,103,121,.2); color:var(--text-dim); }
  .badge.cat{ background:var(--panel-2); color:var(--text-dim); }
  .date{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap; }

  .titre{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; margin-bottom:6px; }
  .resume{ font-size:13.5px; color:#C4CCD9; line-height:1.5; }
  .source{ margin-top:8px; font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }

  .archive-day{ margin-bottom:22px; }
  .archive-day h3{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim);
    letter-spacing:.1em; margin-bottom:10px; padding-bottom:6px; border-bottom:1px dashed var(--line);
  }

  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty h2{ font-family:'Space Grotesk',sans-serif; color:var(--text); margin-bottom:8px; font-size:18px;}

  .loading{ display:flex; align-items:center; gap:10px; color:var(--cyan); font-family:'JetBrains Mono',monospace; font-size:12px; padding:20px 0;}
  .spinner{ width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--cyan); border-radius:50%; animation:spin .8s linear infinite; }

  .error{ background:rgba(255,77,94,.08); border:1px solid rgba(255,77,94,.3); color:var(--critique); padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;}

  @media (prefers-reduced-motion: reduce){
    .sweep, .dot, .spinner{ animation:none; }
  }
</style>
</head>
<body>

<header>
  <div class="radar"></div>
  <div class="sweep"></div>
  <div class="eyebrow"><span class="dot"></span>POSTE DE VEILLE</div>
  <h1>SIGNAL</h1>
  <div class="sub">Cybersécurité, intelligence artificielle et technologie — capté et classé automatiquement.</div>
  <div class="statusbar">
    <span id="statusText">Initialisation…</span>
    <button id="refreshBtn">Recharger les données</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="feed">Derniers signaux</button>
  <button class="tab" data-tab="archive">Faits archivés</button>
</nav>

<main>
  <div id="feedView"></div>
  <div id="archiveView" style="display:none"></div>
</main>

<script>
const IMPORTANCE_ORDER = ['Critique','Élevé','Moyen','Faible'];
let state = { lastUpdate: null, items: [] };
let activeFilters = { categorie: 'Toutes', importance: 'Toutes' };
let activeTab = 'feed';

function slug(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,60); }
function impClass(imp){
  const m = {'Critique':'critique','Élevé':'eleve','Moyen':'moyen','Faible':'faible'};
  return m[imp] || 'faible';
}
function fmtDate(d){
  try{ return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short', day:'2-digit', month:'short'}); }
  catch(e){ return d; }
}
function hoursSince(iso){
  if(!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / 36e5;
}

async function loadState(){
  const status = document.getElementById('statusText');
  status.innerHTML = '<span class="loading"><span class="spinner"></span>Chargement des données…</span>';
  try{
    // data.json est régénéré chaque jour par le workflow GitHub Actions
    const res = await fetch('./data.json?_=' + Date.now());
    if(!res.ok) throw new Error('data.json introuvable');
    state = await res.json();
  }catch(e){
    console.error(e);
    document.getElementById(activeTab === 'feed' ? 'feedView' : 'archiveView')
      .insertAdjacentHTML('afterbegin', `<div class="error">Aucune donnée trouvée pour l'instant. Le premier passage du robot n'a peut-être pas encore eu lieu.</div>`);
  }
}

function refresh(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  loadState().finally(() => { btn.disabled = false; render(); });
}

function card(item){
  return `<div class="card ${impClass(item.importance)}">
    <div class="card-top">
      <div class="badges">
        <span class="badge imp-${impClass(item.importance)}">${item.importance}</span>
        <span class="badge cat">${item.categorie}</span>
      </div>
      <span class="date">${fmtDate(item.date)}</span>
    </div>
    <div class="titre">${item.titre}</div>
    <div class="resume">${item.resume}</div>
    ${item.source ? `<div class="source">Source : ${item.source}</div>` : ''}
    ${item.lien ? `<a class="source" href="${item.lien}" target="_blank" rel="noopener" style="color:var(--cyan); text-decoration:none; display:inline-block; margin-top:4px;">Lire l'article →</a>` : ''}
  </div>`;
}

function renderFeed(){
  const el = document.getElementById('feedView');
  const recent = state.items.filter(i => hoursSince(state.lastUpdate) < 24*3 || true).slice(0, 12);
  if(state.items.length === 0){
    el.innerHTML = `<div class="empty"><h2>Aucun signal pour l'instant</h2><p>Clique sur « Actualiser maintenant » pour lancer la première veille.</p></div>`;
    return;
  }
  el.innerHTML = recent.map(card).join('');
}

function renderArchive(){
  const el = document.getElementById('archiveView');
  const cats = ['Toutes', ...new Set(state.items.map(i => i.categorie))];
  const imps = ['Toutes', ...IMPORTANCE_ORDER];

  let filtered = state.items.filter(i =>
    (activeFilters.categorie === 'Toutes' || i.categorie === activeFilters.categorie) &&
    (activeFilters.importance === 'Toutes' || i.importance === activeFilters.importance)
  );

  const byDate = {};
  filtered.forEach(i => { (byDate[i.date] = byDate[i.date] || []).push(i); });
  const dates = Object.keys(byDate).sort().reverse();

  const filterHtml = `
    <div class="filters">
      ${cats.map(c => `<span class="chip ${activeFilters.categorie===c?'active':''}" data-type="categorie" data-val="${c}">${c}</span>`).join('')}
    </div>
    <div class="filters">
      ${imps.map(i => `<span class="chip ${activeFilters.importance===i?'active':''}" data-type="importance" data-val="${i}">${i}</span>`).join('')}
    </div>`;

  if(dates.length === 0){
    el.innerHTML = filterHtml + `<div class="empty"><h2>Aucun fait archivé</h2><p>Les signaux capturés s'accumulent ici automatiquement.</p></div>`;
  }else{
    el.innerHTML = filterHtml + dates.map(d => `
      <div class="archive-day">
        <h3>${fmtDate(d)} — ${byDate[d].length} fait(s)</h3>
        ${byDate[d].map(card).join('')}
      </div>`).join('');
  }

  el.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeFilters[chip.dataset.type] = chip.dataset.val;
      renderArchive();
    });
  });
}

function render(){
  document.getElementById('feedView').style.display = activeTab === 'feed' ? 'block' : 'none';
  document.getElementById('archiveView').style.display = activeTab === 'archive' ? 'block' : 'none';
  if(activeTab === 'feed') renderFeed(); else renderArchive();

  const status = document.getElementById('statusText');
  if(state.lastUpdate){
    const h = hoursSince(state.lastUpdate);
    status.innerHTML = `<span class="live">● en veille</span> — ${state.items.length} fait(s) au total — dernière mise à jour il y a ${h < 1 ? 'moins d\'1h' : Math.floor(h)+'h'}`;
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    render();
  });
});
document.getElementById('refreshBtn').addEventListener('click', refresh);

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
