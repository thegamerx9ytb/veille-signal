name: Veille quotidienne

on:
  schedule:
  - cron: "0 6 * * *"    # ~7h/8h en France (matin)
  - cron: "0 11 * * *"   # ~12h/13h en France (midi)
  - cron: "0 17 * * *"   # ~18h/19h en France (soir)
  workflow_dispatch: {}     # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install feedparser

      - name: Lancer la veille
        run: python fetch_news.py

      - name: Publier les nouvelles données
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Mise à jour de la veille du jour"
          git push
